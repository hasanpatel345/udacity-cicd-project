name: Backend Continuous Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'starter/backend/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3-dev
      - name: Install pipenv
        run: pip install pipenv
      - name: Install dependencies
        working-directory: starter/backend
        run: pipenv install --dev
      - name: Run lint
        working-directory: starter/backend
        run: pipenv run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3-dev
      - name: Install pipenv
        run: pip install pipenv
      - name: Install dependencies
        working-directory: starter/backend
        run: pipenv install --dev
      - name: Run tests
        working-directory: starter/backend
        run: pipenv run test

  build-and-deploy:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      #- name: Configure AWS credentials
       # uses: aws-actions/configure-aws-credentials@v2
        #with:
         # aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          #aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          #aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push image
        working-directory: starter/backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --tag=$ECR_REGISTRY/backend:$IMAGE_TAG .
          docker push $ECR_REGISTRY/backend:$IMAGE_TAG

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name cluster --region us-east-1

      - name: Deploy to Kubernetes
        working-directory: starter/backend/k8s
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          curl -sLO "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.0.0/kustomize_v5.0.0_linux_amd64.tar.gz"
          tar -xzf kustomize_v5.0.0_linux_amd64.tar.gz
          ./kustomize edit set image backend=$ECR_REGISTRY/backend:$IMAGE_TAG
          ./kustomize build | kubectl apply -f -

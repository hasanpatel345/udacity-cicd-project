name: Frontend Continuous Integration

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'starter/frontend/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: starter/frontend/package-lock.json
      - name: Install dependencies
        working-directory: starter/frontend
        run: npm ci
      - name: Run lint
        working-directory: starter/frontend
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: starter/frontend/package-lock.json
      - name: Install dependencies
        working-directory: starter/frontend
        run: npm ci
      - name: Run tests
        working-directory: starter/frontend
        run: CI=true npm test

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker image
        working-directory: starter/frontend
        run: |
          docker build --build-arg=REACT_APP_MOVIE_API_URL=http://localhost:5000 --tag=mp-frontend:latest .

      - name: Run container
        working-directory: starter/frontend
        run: |
          docker run --name mp-frontend -p 3000:3000 -d mp-frontend:latest

      - name: Wait for container to be ready
        run: |
          echo "Waiting for frontend container to start serving traffic..."
          for i in $(seq 1 15); do
            if curl --silent --fail http://localhost:3000 > /dev/null; then
              echo "Container is up and serving traffic."
              exit 0
            fi
            echo "Not ready yet (attempt $i/15), retrying in 3s..."
            sleep 3
          done
          echo "Container failed health check after 45s."
          docker logs mp-frontend
          exit 1

      - name: Stop and remove container
        if: always()
        run: |
          docker stop mp-frontend || true
          docker rm mp-frontend || true